# Weekly update PRs. A routine update is only proposed once the release is a
# week old (cooldown); security updates ignore the cooldown.
version: 2
updates:
  # pyproject.toml holds ranges, not pins: only widen one when a new release
  # falls outside it.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
